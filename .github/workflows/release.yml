name: Release

# 推 v* 标签时自动打包 macOS / Windows 安装包，并创建 GitHub Release。
#   例：git tag v1.0.0 && git push origin v1.0.0
# 手动触发（Actions → Release → Run workflow）只产出构建产物，不发 Release。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # 仓库里的 .npmrc 指向 npmmirror（方便国内本地开发），
  # CI 跑在境外机器上，这里统一切回官方源。
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

jobs:
  mac:
    name: macOS 安装包
    runs-on: macos-14
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 同步版本号（取自 tag）
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: 构建三端产物
        run: npm run build

      - name: 打包 dmg（arm64 + x64）
        env:
          # 未做代码签名，跳过签名身份自动发现，避免 CI 卡住
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac --publish never

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows 安装包
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 同步版本号（取自 tag）
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: 构建三端产物
        run: npm run build

      - name: 打包 NSIS 安装包
        run: npx electron-builder --win --publish never

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 7

  publish:
    name: 发布 Release
    needs: [mac, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 列出产物
        run: ls -lh artifacts

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
