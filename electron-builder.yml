appId: io.imagekit.uploader.desktop
productName: ImageKit Uploader
copyright: Copyright © 2026 ImageKit Uploader

directories:
  buildResources: build
  output: release

files:
  - out/**
  - package.json
  - '!**/*.map'
  - '!**/{.eslintrc,.editorconfig,.prettierrc}'

asar: true
compression: normal

mac:
  category: public.app-category.developer-tools
  # 注意：这里不写死 arch。dmg 的挂载卷名取自 dmg.title（= productName），
  # 两个架构同名，若并发构建会互相占用卷，导致 hdiutil detach 报
  # "Resource busy"(exit 16) 并中断打包（曾在 GitHub Actions 上复现）。
  # 因此架构一律由命令行显式指定，且必须串行执行：
  #   electron-builder --mac --arm64 && electron-builder --mac --x64
  target:
    - target: dmg
  darkModeSupport: true
  hardenedRuntime: false
  gatekeeperAssess: false
  identity: null
  extendInfo:
    NSHumanReadableCopyright: Copyright © 2026 ImageKit Uploader
    CFBundleName: ImageKit Uploader
    LSMinimumSystemVersion: '10.15'

dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
  title: ${productName}

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${name}-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ImageKit Uploader
  deleteAppDataOnUninstall: false

linux:
  target:
    - AppImage
  category: Graphics
